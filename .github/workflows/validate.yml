name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax, metadata and helpers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pure-helper test dependency
        run: python -m pip install beautifulsoup4==4.13.3

      - name: Compile Python sources
        run: python -m compileall -q custom_components/web_data_assistant tests

      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            python -m json.tool "${file}" >/dev/null
          done < <(find custom_components/web_data_assistant -name '*.json' -print0)
          python -m json.tool hacs.json >/dev/null

      - name: Check frontend JavaScript syntax
        run: node --check custom_components/web_data_assistant/frontend/web-data-assistant-panel.js

      - name: Run pure helper tests
        run: python -m unittest discover -s tests -v

  home-assistant:
    name: Home Assistant runtime smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component==0.13.365

      - name: Run Home Assistant integration tests
        run: python -m pytest -q tests/test_integration.py --maxfail=1

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate integration structure
        uses: home-assistant/actions/hassfest@master
