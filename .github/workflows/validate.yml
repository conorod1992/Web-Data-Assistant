name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax, metadata and helpers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pure-helper test dependency
        run: python -m pip install beautifulsoup4==4.13.3

      - name: Compile Python sources
        run: python -m compileall -q custom_components/web_data_assistant tests

      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            python -m json.tool "${file}" >/dev/null
          done < <(find custom_components/web_data_assistant -name '*.json' -print0)
          python -m json.tool hacs.json >/dev/null

      - name: Check frontend JavaScript syntax
        run: node --check custom_components/web_data_assistant/frontend/web-data-assistant-panel.js

      - name: Run pure helper tests
        run: python tests/test_extraction_preview.py -v

  browser:
    name: Browser panel smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  home-assistant:
    name: Home Assistant runtime smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Home Assistant integration tests
        run: >-
          python -m pytest -q
          tests/test_integration.py
          tests/test_frontend_runtime.py
          tests/test_config_flow_runtime.py
          tests/test_scrape_flow_runtime.py
          tests/test_runtime_semantics.py
          tests/test_client_http.py
          tests/test_client_http_content_type.py
          --maxfail=1

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate integration structure
        uses: home-assistant/actions/hassfest@master
